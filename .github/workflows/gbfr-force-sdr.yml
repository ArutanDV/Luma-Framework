name: Build GBFR (Force SDR Output)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/gbfr-force-sdr.yml'

jobs:
  build:
    runs-on: windows-2025-vs2026
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1.2

    - name: Integrate vcpkg with MSBuild
      shell: pwsh
      run: '& "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" integrate install'

    - name: Apply the ForceSDROutput patch
      shell: pwsh
      run: |
        [IO.File]::WriteAllBytes("force-sdr.patch", [Convert]::FromBase64String(""))
        git apply --whitespace=nowarn force-sdr.patch
        git diff --stat

    - name: Build Granblue Fantasy Relink (Publishing-Release x64)
      shell: pwsh
      run: |
        ConvertTo-Json -Depth 3 @{ solution = @{ path = "Luma.sln"; projects = @("Source\Games\Granblue Fantasy Relink\Granblue Fantasy Relink.vcxproj") } } | Set-Content Luma.slnf
        msbuild Luma.slnf /m /p:Configuration=Publishing-Release /p:Platform=x64 /p:DefineConstants="REMOTE_BUILD=1"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Get-ChildItem -Recurse -Filter "*.addon" | ForEach-Object { Write-Host $_.FullName }

    - name: Upload the addon
      uses: actions/upload-artifact@v4
      with:
        name: Luma-GBFR-ForceSDR
        path: '**/Luma-Granblue Fantasy Relink.addon'
        if-no-files-found: error
